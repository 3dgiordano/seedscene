<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEEDSCENE &mdash; one seed, one demo</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: "Courier New", ui-monospace, monospace; color: #cfe8ff;
  }
  #stage {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; image-rendering: pixelated;
    box-shadow: 0 0 70px rgba(70, 140, 255, 0.22);
  }
  #hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 5;
    font-size: 11px; line-height: 1.6; letter-spacing: 0.5px;
    background: rgba(5, 8, 16, 0.55); border: 1px solid rgba(120, 180, 255, 0.18);
    border-radius: 4px; padding: 8px 12px; backdrop-filter: blur(3px);
    pointer-events: none; transition: opacity 0.2s;
  }
  #hud.hidden { opacity: 0; }
  #hud b { color: #fff; letter-spacing: 2px; }
  /* --- the C64 boot screen ------------------------------------------- */
  #boot {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #6c5eb5;                       /* light blue border */
    transform-origin: 50% 50%;
  }
  #boot.off { animation: crt-off 0.42s ease-in forwards; }
  @keyframes crt-off {
    0%   { transform: scale(1, 1);     filter: brightness(1); opacity: 1; }
    55%  { transform: scale(1, 0.006); filter: brightness(3); opacity: 1; }
    100% { transform: scale(0, 0.006); filter: brightness(5); opacity: 0; }
  }
  #screen {
    margin: 0; overflow: hidden; white-space: pre;
    background: #352879; color: #6c5eb5;       /* blue screen, light blue text */
    font-family: Consolas, "Lucida Console", "DejaVu Sans Mono", Menlo, "Courier New", monospace;
    font-weight: bold; text-transform: uppercase;
    box-shadow: inset 0 0 6vmin rgba(0, 0, 0, 0.35);
    /* a hint of phosphor and scanlines */
    text-shadow: 0 0 0.35em rgba(140, 125, 230, 0.55);
    background-image: repeating-linear-gradient(
      to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.16) 3px);
  }
  #screen .cur { background: #6c5eb5; }
  #screen .rev { background: #6c5eb5; color: #352879; text-shadow: none; }

  /* --- once the info panel fades, a quiet reminder of where the keys are -- */
  #hint {
    position: fixed; right: 14px; bottom: 12px; z-index: 5; pointer-events: none;
    font: bold 11px Consolas, "Lucida Console", monospace; letter-spacing: 2px;
    color: #a99ff0; opacity: 0; transition: opacity 0.6s;
  }
  #hud.hidden ~ #hint, body.about #hint { opacity: 0.6; }
  #menu.open ~ #hint, #help.open ~ #hint { opacity: 0; }

  /* --- what just changed: a short notice, top right ----------------------- */
  #toast {
    position: fixed; right: 14px; top: 12px; z-index: 9; pointer-events: none;
    font: bold clamp(11px, 1.2vw, 15px) Consolas, "Lucida Console", monospace;
    letter-spacing: 0.14em; text-transform: uppercase;
    background: #352879; color: #c9c2ff; border: 3px solid #6c5eb5;
    padding: 0.35em 0.8em; opacity: 0; transform: translateY(-6px);
    transition: opacity 0.18s, transform 0.18s;
  }
  #toast.show { opacity: 1; transform: none; }
  body.about #hud { display: none; }

  /* --- SETUP menu and KEYS screen, C64 program-menu style ----------------- */
  #menu, #help {
    position: fixed; inset: 0; z-index: 8; display: none;
    align-items: center; justify-content: center;
    background: rgba(5, 6, 14, 0.35);
  }
  #menu.open, #help.open { display: flex; }
  #help { pointer-events: none; background: rgba(5, 6, 14, 0.25); }
  #menu .panel, #help .panel {
    background: #352879; color: #a99ff0;
    border: 0.7em solid #6c5eb5;
    font: bold clamp(12px, 1.55vw, 19px) Consolas, "Lucida Console", "DejaVu Sans Mono", Menlo, monospace;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 1.1em 1.4em 1em; min-width: min(34em, 92vw);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
    text-shadow: 0 0 0.35em rgba(140, 125, 230, 0.5);
  }
  #menu .title, #help .title { text-align: center; color: #c9c2ff; margin-bottom: 1em; }
  #help .krow { display: flex; gap: 1.6em; padding: 0.18em 0.6em; }
  #help .key { min-width: 6.5em; color: #e4dfff; }
  #menu .row {
    display: flex; justify-content: space-between; align-items: center; gap: 2em;
    padding: 0.28em 0.6em; cursor: pointer;
  }
  #menu .row.sel { background: #6c5eb5; color: #352879; text-shadow: none; }
  #menu .field { display: flex; align-items: center; gap: 0.6em; }
  #menu .arrow { opacity: 0.75; padding: 0 0.2em; }
  #menu .arrow:hover { opacity: 1; }
  #menu .value { min-width: 9em; text-align: center; }
  #menu input.seed {
    font: inherit; letter-spacing: inherit; text-transform: none;
    color: inherit; background: rgba(0, 0, 0, 0.18); border: none; outline: none;
    width: 13em; padding: 0.1em 0.4em; text-align: center; caret-color: currentColor;
  }
  #menu .row.sel input.seed { background: rgba(53, 40, 121, 0.25); }
  #menu .help, #help .help { margin-top: 1.1em; text-align: center; font-size: 0.72em; opacity: 0.75; }
  #help .help { animation: blink 1.1s steps(2, start) infinite; font-size: 0.8em; opacity: 1; }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="hud"></div>
  <div id="menu"></div>
  <div id="help"></div>
  <div id="toast"></div>
  <div id="hint">H &middot; KEYS</div>
  <div id="boot"><pre id="screen"></pre></div>
  <script type="module" src="./live.js"></script>
</body>
</html>
